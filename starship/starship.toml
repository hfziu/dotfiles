add_newline = false
command_timeout = 300

format = "$username${custom.host_or_distrobox}$directory${env_var.python_venv}$git_branch$git_status$cmd_duration$character"

[directory]
fish_style_pwd_dir_length = 1
style = "blue"

[env_var.python_venv]
variable = "VIRTUAL_ENV_PROMPT"
format = "[($env_value)]($style) "
style = "bright-black"

[git_branch]
format = "[$branch]($style) "
style = "bright-black"

[git_status]
format = "([$all_status]($style) )"
diverged = "↕" # U+2195
deleted = "×" # U+00D7

[username]
show_always = false
style_user = "bright-green"
style_root = "red"
format = "[$user]($style)"

[custom.host_or_distrobox]
command = '''
if [ -n "$CONTAINER_ID" ]; then
	printf '%s' "$CONTAINER_ID"
elif [ -n "$SSH_CONNECTION" ]; then
	hostname
fi
'''
when = 'test -n "$CONTAINER_ID" || test -n "$SSH_CONNECTION"'
format = "@[$output]($style) "
style = "yellow"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "dimmed white"

[character]
success_symbol = "[>](magenta)"
error_symbol = "[>](red)"
vimcmd_symbol = "[<](green)"
